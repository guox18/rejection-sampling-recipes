# 模型服务配置文件 - 包含所有可用模型的配置
# 用法: bash start_vllm_service.sh --config model_config.yaml --model <模型名称> --router-ip <IP> --router-port <PORT>

# MoE VL 模型 - 需要 expert parallel 和 mm-encoder-tp-mode
qwen3_vl_235b_a22b_thinking:
  tp: 8                    # 张量并行度
  dp: 1                    # 数据并行度
  pp: 1                    # 流水线并行度
  max_model_len: 128000    # 最大模型长度（可选）
  model_path: "/mnt/shared-storage-user/large-model-center-share-weights/hf_hub/models--Qwen--Qwen3-VL-235B-A22B-Thinking/snapshots/c6a4947308cff8b5dcd126e37d394e8d3f97fac9"
  # vllm 额外参数配置
  vllm_extra_args:
    gpu-memory-utilization: 0.85
    enable-expert-parallel: true        # MoE 模型需要
    max-num-seqs: 128
    max-num-batched-tokens: 16384
    mm-encoder-tp-mode: data            # VL 模型需要
    async-scheduling: true

