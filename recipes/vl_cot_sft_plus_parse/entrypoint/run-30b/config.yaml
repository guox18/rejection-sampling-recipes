# LLM parser 配置
parse_model: qwen25_32b_instruct
parse_base_url: http://10.102.249.62:21003/v1
parse_api_key: dummy
parse_temperature: 0.0
parse_max_tokens: 8096
parse_max_workers: 256

# 采样配置
model: qwen3_vl_30b_a3b_thinking
base_url: http://10.102.249.62:21002/v1
api_key: dummy
n_samples: 2
temperature: 0.6
max_tokens: 10240
semaphore_per_sampler: 64

# 数据路径配置
# abs_image_path_field: 图片绝对路径字段（支持嵌套，如 meta_info.abs_image_path 或 abs_path）
# max_image_size_mb: 图像文件大小限制（MB），超过此大小的图像会被标记为 failed（默认 100MB）
abs_image_path_field: abs_path
max_image_size_mb: 100.0

# LLM Judge 配置
judge_model: qwen25_32b_instruct
judge_base_url: http://10.102.249.62:21003/v1
judge_api_key: dummy
judge_temperature: 0.0
judge_max_tokens: 10
verifier_max_workers: 256  # VerifierStage 线程池大小 (batch 内 item 级别并发)

# 格式化配置
pass_threshold: 1.0

# 重试配置
max_retries: 2

# Pipeline 配置
batch_size: 128  # 每个 batch 的数据量
concurrency: 2  # 默认并发度(Stage 的 actor 数量)
sampler_concurrency: 10  # SamplerStage 并发度
verifier_concurrency: 2  # VerifierStage 并发度